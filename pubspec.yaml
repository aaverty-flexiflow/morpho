name: morpho
description: Build habits, grow plants.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  slang: ^4.0.0
  slang_flutter: ^4.0.0

  flutter_riverpod: ^3.4.2

  sqflite: ^2.4.3
  path: ^1.9.1

  go_router: ^17.3.0

  flutter_animate: ^4.5.2
  gap: ^3.0.1

  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  shared_preferences: ^2.5.5
  permission_handler: ^12.0.3

  home_widget: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  slang_build_runner: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/fr.i18n.json
    - assets/i18n/en.i18n.json
